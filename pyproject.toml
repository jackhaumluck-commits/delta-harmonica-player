[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-harmonica-player"
dynamic = ["version"]
description = "Parse numbered harmonica scores into timed keyboard and mouse actions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mido>=1.3.3,<2"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]

[tool.setuptools.packages.find]
include = ["harmonica_player*"]

[tool.setuptools.dynamic]
version = {attr = "harmonica_player.__version__"}
