name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and build tools
        run: python -m pip install ".[build]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import harmonica_player; print(harmonica_player.__version__)"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "标签 $env:RELEASE_TAG 与程序版本 v$version 不一致"
          }

      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm DeltaHarmonicaPlayer.spec

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $path = "dist\DeltaHarmonicaPlayer.exe"
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  DeltaHarmonicaPlayer.exe" | Set-Content -LiteralPath "$path.sha256" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: DeltaHarmonicaPlayer-Windows
          path: |
            dist/DeltaHarmonicaPlayer.exe
            dist/DeltaHarmonicaPlayer.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/DeltaHarmonicaPlayer.exe" `
            "dist/DeltaHarmonicaPlayer.exe.sha256" `
            --verify-tag `
            --title "三角洲口琴自动演奏器 ${{ github.ref_name }}" `
            --generate-notes
